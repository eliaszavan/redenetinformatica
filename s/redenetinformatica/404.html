<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página não encontrada | RedeNet Informática</title>

    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/css/404.css">
</head>

<body>
    <main class="errorPage">
        <div class="errorDecoration errorDecorationOne" aria-hidden="true"></div>
        <div class="errorDecoration errorDecorationTwo" aria-hidden="true"></div>

        <div class="errorCard">
            <a href="/" class="errorLogo" aria-label="Voltar para a página inicial">
                <img src="/assets/horizontal_logo.avif" alt="RedeNet Informática">
            </a>

            <div class="errorCode" role="img" aria-label="Erro 404">
                <span aria-hidden="true">4</span>

                <div class="errorZero" aria-hidden="true">
                    <i class="fa-solid fa-plug" aria-hidden="true"></i>
                </div>

                <span aria-hidden="true">4</span>
            </div>

            <span class="errorLabel">PÁGINA NÃO ENCONTRADA</span>

            <h1>Parece que essa conexão se perdeu.</h1>
            <p>
                A página que você tentou acessar não existe,
                foi movida ou o endereço pode estar incorreto.
            </p>

            <a href="/" class="errorHome">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                Voltar para o início
            </a>

            <div class="errorFooter">
                <span aria-hidden="true"></span>
                <p>RedeNet Informática • Paranavaí - PR</p>
                <span aria-hidden="true"></span>
            </div>
        </div>
    </main>
</body>
</html>
